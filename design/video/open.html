<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haven · Open</title>
<!--
  Source for the statistic: WHO news release, 30 June 2025,
  "Social connection linked to improved health and reduced risk of early death"
  https://www.who.int/news/item/30-06-2025-social-connection-linked-to-improved-heath-and-reduced-risk-of-early-death
  WHO's wording: "1 in 6 people worldwide is affected by loneliness" (WHO Commission on Social Connection report).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --bg: #fdfbf7; --ink: #23211e; --muted: #68625b; --brand: #9a4100; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); cursor: none; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 1)); background: var(--bg);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink);
  }
  .lines { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; }
  .line { font-size: 76px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; opacity: 0; }
  .stat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
  .big { font-size: 104px; font-weight: 700; letter-spacing: -0.03em; opacity: 0; text-align: center; line-height: 1.12; }
  .big b { color: var(--brand); font-weight: 800; }
  .src { font-size: 30px; font-weight: 500; color: var(--muted); opacity: 0; }

  @keyframes in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* Timeline (s): lines at 0.4 / 1.7 / 3.0 / 4.5, all out at 7.2, statistic 8.0, source 9.0, hold to 12. */
  .play .l1 { animation: in .8s ease-out .4s both, out .7s ease-in 7.2s forwards; }
  .play .l2 { animation: in .8s ease-out 1.7s both, out .7s ease-in 7.2s forwards; }
  .play .l3 { animation: in .8s ease-out 3.0s both, out .7s ease-in 7.2s forwards; }
  .play .l4 { animation: in .8s ease-out 4.5s both, out .7s ease-in 7.2s forwards; }
  .play .big { animation: in 1s ease-out 8.0s both; }
  .play .src { animation: fade .8s ease-out 9.0s both; }
</style>
</head>
<body>
<div id="stage">
  <div class="lines">
    <div class="line l1">Your mom.</div>
    <div class="line l2">Your grandad.</div>
    <div class="line l3">The friend who moved away.</div>
    <div class="line l4">The neighbour who taught you to ride a bike.</div>
  </div>
  <div class="stat">
    <div class="big"><b>1 in 6</b> people worldwide<br>are affected by loneliness.</div>
    <div class="src">World Health Organization, 2025</div>
  </div>
</div>
<script>
  // Plays on load; Space restarts from the first frame (start the recorder, then press Space).
  const stage = document.getElementById("stage");
  const fit = () => stage.style.setProperty("--s", Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener("resize", fit); fit();
  const play = () => { stage.classList.remove("play"); void stage.offsetWidth; stage.classList.add("play"); };
  document.fonts.ready.then(play);
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); play(); } });
</script>
</body>
</html>
